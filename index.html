<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothify - Home PAge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <link rel="stylesheet" href="sweetalert2.min.css"> -->

    <link rel="stylesheet" href="assets/css/home.css">
</head>

<body>

    <!-- /////////////////////////////////////////////////  Nav ////////////////////////////////////////////////////////////////// -->
    <!-- ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->
    <!-- ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->
    <!-- ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// -->

    <div class="container-fluid d-flex justify-content-between align-items-center mt--lg-1 border-bottom shadow-sm">

        <div class="col-3">
            <div class="d-flex align-items-center gap-3">
                <img src="assets/img/siteLogo.png" class="siteLogo" alt="">
                <h4 class="fw-bold m-0">Clothify Store</h4>
            </div>
        </div>

        <div class="col-5"></div>

        <div class="col-3 d-flex gap-4 justify-content-end">
            <p id="cartMsg" style="display: none;">closed</p>
            <button onclick="openCartItem()" type="button" class="navTwoBtn position-relative">
                <svg class="navSvgSize" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path
                        d="M24 48C10.7 48 0 58.7 0 72C0 85.3 10.7 96 24 96L69.3 96C73.2 96 76.5 98.8 77.2 102.6L129.3 388.9C135.5 423.1 165.3 448 200.1 448L456 448C469.3 448 480 437.3 480 424C480 410.7 469.3 400 456 400L200.1 400C188.5 400 178.6 391.7 176.5 380.3L171.4 352L475 352C505.8 352 532.2 330.1 537.9 299.8L568.9 133.9C572.6 114.2 557.5 96 537.4 96L124.7 96L124.3 94C119.5 67.4 96.3 48 69.2 48L24 48zM208 576C234.5 576 256 554.5 256 528C256 501.5 234.5 480 208 480C181.5 480 160 501.5 160 528C160 554.5 181.5 576 208 576zM432 576C458.5 576 480 554.5 480 528C480 501.5 458.5 480 432 480C405.5 480 384 501.5 384 528C384 554.5 405.5 576 432 576z" />
                </svg>
                <span id="cartItemsCount"
                    class="position-absolute top-0 start-100 translate-middle badge bg-primary">0</span>
            </button>
            <button type="button" class="navTwoBtn position-relative">
                <svg class="navSvgSize" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path
                        d="M442.9 144C415.6 144 389.9 157.1 373.9 179.2L339.5 226.8C335 233 327.8 236.7 320.1 236.7C312.4 236.7 305.2 233 300.7 226.8L266.3 179.2C250.3 157.1 224.6 144 197.3 144C150.3 144 112.2 182.1 112.2 229.1C112.2 279 144.2 327.5 180.3 371.4C221.4 421.4 271.7 465.4 306.2 491.7C309.4 494.1 314.1 495.9 320.2 495.9C326.3 495.9 331 494.1 334.2 491.7C368.7 465.4 419 421.3 460.1 371.4C496.3 327.5 528.2 279 528.2 229.1C528.2 182.1 490.1 144 443.1 144zM335 151.1C360 116.5 400.2 96 442.9 96C516.4 96 576 155.6 576 229.1C576 297.7 533.1 358 496.9 401.9C452.8 455.5 399.6 502 363.1 529.8C350.8 539.2 335.6 543.9 320 543.9C304.4 543.9 289.2 539.2 276.9 529.8C240.4 502 187.2 455.5 143.1 402C106.9 358.1 64 297.7 64 229.1C64 155.6 123.6 96 197.1 96C239.8 96 280 116.5 305 151.1L320 171.8L335 151.1z" />
                </svg>
                <span id="likedItemsCount"
                    class="position-absolute top-0 start-100 translate-middle badge bg-primary">0</span>
            </button>
        </div>

        <div class="col-1"></div>
    </div>


    <div class="conatiner-fluid mt-lg-5">

        <div class="row">
            <!-- //////////////////////////////////////////  left side //////////////////////////////////////////////// -->
            <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////// -->
            <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////// -->
            <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////// -->

            <div class="col-lg-12 col-sm-8 " id="leftSideDivProductCard">

                <div class="row mt-4">
                    <div class="col-lg-12 col-sm-12">
                        <div class="heroNav d-flex text-center border-bottom shadow-sm justify-content-center">
                            <ul class="d-flex list-unstyled gap-lg-5">
                                <li class="nav-item">
                                    <button class="heroNavBtns active" id="heroNavBtn1">All</button>
                                </li>
                                <li class="nav-item">
                                    <button class="heroNavBtns" id="heroNavBtn2">New Arrivals</button>
                                </li>
                                <li class="nav-item">
                                    <button class="heroNavBtns" id="heroNavBtn3">Tops</button>
                                </li>
                                <li class="nav-item">
                                    <button class="heroNavBtns" id="heroNavBtn4">Bottoms</button>
                                </li>
                                <li class="nav-item">
                                    <button class="heroNavBtns" id="heroNavBtn5">OutWare</button>
                                </li>
                                <li class="nav-item">
                                    <button class="heroNavBtns" id="heroNavBtn6">Accessories</button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="container">
                    <div class="row mt-5 gap-0 mx-5" id="allProductCardGenerate">

                    </div>
                </div>
            </div>


            <!-- //////////////////////////////////////////  right side //////////////////////////////////////////////// -->
            <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////// -->
            <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////// -->
            <!-- ////////////////////////////////////////////////////////////////////////////////////////////////////// -->


            <div class="col-lg-5 mainPageRightSide border-start border-end border-top shadow-sm" id="mainPageRightSide">
                <div class="container-fluid mx-lg-1">
                    <div class="container text-center rightMainDiv" id="rightMainDiv">

                        <div class="row mt-5">
                            <div class="col-lg-12 mt-3">
                                <h2 class="noitmCartH">NoItems In Cart </h2>
                            </div>
                            <div class="col-lg-12 mt-3">
                                <img src="assets/img/empty-cart.png" class="emptyCart" alt="">
                            </div>
                        </div>

                    </div>

                    <!-- ////////////////////////////// -->
                    <div class="row mt-lg-5 addedItemsTot2" id="addedItemsTot2">
                        <div class="row mt-lg-3">
                            <div class="col-lg-6 d-flex">
                                <h6 class="totOther">Discount</h6>
                            </div>

                            <div class="col-lg-6">
                                <div class="addDiscountDiv">
                                    <button id="addDiscountBtn" onclick="showDiscountField()">Add Discount</button>
                                    <input id="addDiscountTxt" type="text" placeholder="Enter Discount..."
                                        style="display:none;">
                                </div>
                            </div>
                        </div>


                        <div class="row mt-lg-3">
                            <div class="col-lg-6 d-flex">
                                <h6 class="totOther">Total Price</h6>
                            </div>

                            <div class="col-lg-6">
                                <div class="addDiscountDiv">
                                    <h6 class="totalValue" id="rightTotalValue">Rs.0.00</h6>
                                </div>
                            </div>
                        </div>


                        <div class="row mt-lg-3">
                            <div class="col-lg-6 d-flex">
                                <h6 class="totOther">Tax (2%)</h6>
                            </div>

                            <div class="col-lg-6">
                                <div class="addDiscountDiv">
                                    <h6 class="totalValue" id="TaxValueP">Rs.0.00</h6>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-lg-3">
                            <div class="col-lg-6 d-flex">
                                <h6 class="totOther">Cash On Dilivery Charges</h6>
                            </div>

                            <div class="col-lg-6 border-3 border-danger-subtle border-bottom">
                                <div class="addDiscountDiv">
                                    <h6 class="totalValue" id="cashOnDeliveryValue">Rs.0.00</h6>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-lg-3">
                            <div class="col-lg-6 d-flex">
                                <h6 class="totOther">SubToTal Price :</h6>
                            </div>

                            <div class="col-lg-6">
                                <div class="addDiscountDiv">
                                    <h6 class="totalValue" id="subtotalValueInRight">Rs.0.00</h6>
                                </div>
                            </div>
                        </div>


                        <div class="row mt-lg-3 ">
                            <div class="col-lg-6 d-flex gap-4">
                                <h6 class="totOther">Discount</h6>
                                <p class="totOther2" id="appliedDiscount"></p>
                            </div>

                            <div class="col-lg-6  border-3 border-info border-bottom">
                                <div class="addDiscountDiv">
                                    <h6 class="totalValue" id="discountedValue">Rs.0.00</h6>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-lg-3">
                            <div class="col-lg-6 d-flex">
                                <h4 class="finalTotHTag">Total</h4>
                            </div>

                            <div class="col-lg-6 border-3 border-info border-bottom">
                                <div class="addDiscountDiv">
                                    <h3 class="finalTotValue" id="rightNetPrice">Rs.0.00</h3>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-lg-5 mb-lg-5">
                            <div class="col-lg-12 d-flex justify-content-center">
                                <button class="codBtn" onclick="orderItemsBtn()">Order Item And Pay Cash On
                                    Delivery</button>
                                <svg class="codSvg mt-lg-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                    <path
                                        d="M192 96C156.7 96 128 124.7 128 160L128 384C128 419.3 156.7 448 192 448L544 448C579.3 448 608 419.3 608 384L608 160C608 124.7 579.3 96 544 96L192 96zM368 192C412.2 192 448 227.8 448 272C448 316.2 412.2 352 368 352C323.8 352 288 316.2 288 272C288 227.8 323.8 192 368 192zM192 216L192 168C192 163.6 195.6 160 200 160L248 160C252.4 160 256.1 163.6 255.5 168C251.9 197 228.9 219.9 200 223.5C195.6 224 192 220.4 192 216zM192 328C192 323.6 195.6 319.9 200 320.5C229 324.1 251.9 347.1 255.5 376C256 380.4 252.4 384 248 384L200 384C195.6 384 192 380.4 192 376L192 328zM536 223.5C507 219.9 484.1 196.9 480.5 168C480 163.6 483.6 160 488 160L536 160C540.4 160 544 163.6 544 168L544 216C544 220.4 540.4 224.1 536 223.5zM544 328L544 376C544 380.4 540.4 384 536 384L488 384C483.6 384 479.9 380.4 480.5 376C484.1 347 507.1 324.1 536 320.5C540.4 320 544 323.6 544 328zM80 216C80 202.7 69.3 192 56 192C42.7 192 32 202.7 32 216L32 480C32 515.3 60.7 544 96 544L488 544C501.3 544 512 533.3 512 520C512 506.7 501.3 496 488 496L96 496C87.2 496 80 488.8 80 480L80 216z" />
                                </svg>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </div>
    </div>


    <!-- ///////////////////////////////////////////////////////// -->
    <div class="modal fade" id="popupDisplayCusDetails" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Delivery Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Customer Name</label>
                        <input type="text" id="customerName" class="form-control" placeholder="Enter full name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Telephone Number</label>
                        <input type="text" id="phone1" class="form-control" placeholder="ex : 07XXXXXXXX">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Extra Telephone Number (Optional)</label>
                        <input type="text" id="phone2" class="form-control" placeholder="ex : 07XXXXXXXX">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea id="address" rows="3" class="form-control" placeholder="Enter address..."></textarea>
                    </div>
                </div>

                <div class="modal-footer d-flex justify-content-between">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" onclick="addOrder()">Order Now</button>
                </div>

            </div>
        </div>
    </div>
    <!-- =============================================================== -->




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="assets/js/home.js"></script>
</body>

</html>
